name: Validate resilience cache

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verified-snapshot-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check resilience module and tests
        run: |
          node --check assets/dashboard-resilience.js
          node --check tests/dashboard-resilience-cache.test.mjs
      - name: Test verified snapshot trust boundary
        run: node --test tests/dashboard-resilience-cache.test.mjs
