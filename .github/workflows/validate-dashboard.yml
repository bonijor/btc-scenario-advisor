name: Validate dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate modular frontend files
        shell: bash
        run: |
          test -s index.html
          test -s assets/app.js
          test -s assets/styles.css
          test -s docs/optimization-log.md
          grep -q 'assets/styles.css' index.html
          grep -q 'assets/app.js' index.html

      - name: Syntax-check browser JavaScript
        run: node --check assets/app.js

      - name: Safety assertions
        shell: bash
        run: |
          grep -q 'btc-shadow-90d-20260817T173948Z' index.html
          grep -q 'SHADOW' index.html
          grep -q 'SPOT_ONLY' index.html
          grep -q 'API READ-ONLY' index.html
          grep -q 'btc-shadow-dashboard-api-o7li7xggnq-rj.a.run.app' assets/app.js
          grep -q 'automaticExecution' docs/optimization-log.md || true

          if grep -RniE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:|BINANCE_API_SECRET|EXCHANGE_API_SECRET' . --exclude-dir=.git; then
            echo 'Material sensible detectado.'
            exit 1
          fi

          if grep -niE -- "method:[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]|/api/v3/order" assets/app.js; then
            echo 'Se detectó una ruta o método de escritura prohibido en el frontend.'
            exit 1
          fi

      - name: Guardrail assertions
        shell: bash
        run: |
          grep -q 'sin órdenes reales' index.html
          grep -q 'no SELL' index.html
          grep -q 'no shorts' index.html
          grep -q 'API pública sólo lectura' docs/optimization-log.md
