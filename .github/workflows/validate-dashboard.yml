name: Validate dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate modular frontend files
        shell: bash
        run: |
          test -s index.html
          test -s assets/app.js
          test -s assets/responsive-bootstrap.js
          test -s assets/accessibility.js
          test -s assets/product.js
          test -s assets/firebase-auth.js
          test -s assets/styles.css
          test -s assets/accessibility.css
          test -s assets/product.css
          test -s docs/optimization-log.md
          test -s docs/product-phase2.md
          test -s package.json
          test -s playwright.config.mjs
          test -s tests/e2e/dashboard-responsive.spec.mjs
          test -s tests/e2e/dashboard-accessibility.spec.mjs
          test -s tests/e2e/product-account.spec.mjs
          test -s tests/performance/static-budget.mjs
          test -s tests/performance/run-lighthouse.mjs
          test -s tests/serve.mjs
          grep -q 'assets/styles.css' index.html
          grep -q 'assets/accessibility.css' index.html
          grep -q 'assets/product.css' index.html
          grep -q 'assets/accessibility.js' index.html
          grep -q 'assets/app.js' index.html
          grep -q 'assets/product.js' index.html
          grep -q 'assets/responsive-bootstrap.js' index.html

      - name: Syntax-check browser JavaScript and QA files
        run: |
          node --check assets/app.js
          node --check assets/responsive-bootstrap.js
          node --check assets/accessibility.js
          node --check assets/product.js
          node --check assets/firebase-auth.js
          node --check playwright.config.mjs
          node --check tests/e2e/dashboard-responsive.spec.mjs
          node --check tests/e2e/dashboard-accessibility.spec.mjs
          node --check tests/e2e/product-account.spec.mjs
          node --check tests/performance/static-budget.mjs
          node --check tests/performance/run-lighthouse.mjs
          node --check tests/serve.mjs

      - name: Validate DOM contract
        shell: python
        run: |
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('assets/app.js').read_text(encoding='utf-8') + '\n' + Path('assets/product.js').read_text(encoding='utf-8')
          ids = re.findall(r'\bid=["\']([^"\']+)["\']', html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          assert not duplicates, f'IDs duplicados: {duplicates}'
          idset = set(ids)
          refs = set(re.findall(r"\$\(['\"]([^'\"]+)['\"]\)", js))
          missing = sorted(refs - idset)
          assert not missing, f'IDs usados por JS pero ausentes en HTML: {missing}'
          views = set(re.findall(r'data-view=["\']([^"\']+)["\']', html))
          missing_views = sorted(views - idset)
          assert not missing_views, f'Vistas sin sección destino: {missing_views}'
          print(f'PASS_DOM_CONTRACT ids={len(idset)} jsRefs={len(refs)} views={len(views)}')

      - name: Validate responsive contract
        shell: bash
        run: |
          grep -q 'ResizeObserver' assets/app.js
          grep -q 'orientationchange' assets/app.js
          grep -q 'visualViewport' assets/app.js
          grep -q 'chartViewportProfile' assets/app.js
          grep -q 'requestAnimationFrame' assets/app.js
          grep -q 'devicePixelRatio' assets/app.js
          grep -q 'requestAnimationFrame' assets/responsive-bootstrap.js
          grep -q "addEventListener('load'" assets/responsive-bootstrap.js
          grep -q "addEventListener('pageshow'" assets/responsive-bootstrap.js
          grep -q 'document.fonts' assets/responsive-bootstrap.js
          grep -q 'clamp(' assets/styles.css
          grep -q 'minmax(0,1fr)' assets/styles.css
          grep -q 'safe-area-inset-bottom' assets/styles.css
          grep -q '@media(max-width:520px)' assets/styles.css
          grep -q '@media(max-width:380px)' assets/styles.css
          grep -q 'orientation:landscape' assets/styles.css
          grep -q 'prefers-reduced-motion' assets/styles.css
          grep -q 'overflow-x:auto' assets/styles.css
          grep -q 'repeat(6,minmax(0,1fr))' assets/product.css
          grep -q 'authFederatedActions' assets/product.css
          echo 'PASS_RESPONSIVE_CONTRACT'

      - name: Validate accessibility contract
        shell: bash
        run: |
          grep -q 'class="skipLink"' index.html
          grep -q 'id="main-content"' index.html
          grep -q 'aria-current="page"' index.html
          grep -q 'aria-pressed="true"' index.html
          grep -q 'aria-describedby="chartA11y"' index.html
          grep -q '<caption class="srOnly">' index.html
          grep -q 'tabindex="0" role="region"' index.html
          grep -q 'syncNavigationState' assets/accessibility.js
          grep -q 'syncTimeframeState' assets/accessibility.js
          grep -q 'const dashboardFixture' assets/accessibility.js
          grep -q "/ticker/24hr" assets/accessibility.js
          grep -q "/klines" assets/accessibility.js
          grep -q "/api/v1/dashboard" assets/accessibility.js
          grep -q ':focus-visible' assets/accessibility.css
          grep -q '.srOnly' assets/accessibility.css
          grep -q 'contrastRatio' tests/e2e/dashboard-accessibility.spec.mjs
          echo 'PASS_ACCESSIBILITY_CONTRACT'

      - name: Validate Phase 2B identity contract
        shell: bash
        run: |
          grep -q 'id="account"' index.html
          grep -q 'data-view="account"' index.html
          grep -q 'data-auth-form="login"' index.html
          grep -q 'data-auth-form="register"' index.html
          grep -q 'id="preferencesForm"' index.html
          grep -q "phase: '2B'" assets/product.js
          grep -q 'authEnabled: true' assets/product.js
          grep -q "import('./firebase-auth.js')" assets/product.js
          grep -q '__BTC_AUTH_TEST_ADAPTER_FACTORY__' assets/product.js
          grep -q 'serverProfileEnabled: false' assets/product.js
          grep -q 'membershipEnabled: false' assets/product.js
          grep -q 'alertsDeliveryEnabled: false' assets/product.js
          grep -q 'browserLocalPersistence' assets/firebase-auth.js
          grep -q 'signInWithEmailAndPassword' assets/firebase-auth.js
          grep -q 'createUserWithEmailAndPassword' assets/firebase-auth.js
          grep -q 'sendEmailVerification' assets/firebase-auth.js
          grep -q 'signInWithPopup' assets/firebase-auth.js
          grep -q 'signOut(auth)' assets/firebase-auth.js
          grep -q 'passwordInput.value = ' assets/product.js
          grep -q 'preferenceStorageKey' assets/product.js
          grep -q 'No modifican el modelo Quant' assets/product.js
          grep -q 'email login clears password' tests/e2e/product-account.spec.mjs
          grep -q 'Google sign-in and logout' tests/e2e/product-account.spec.mjs
          grep -q 'Firebase Authentication' docs/product-phase2.md
          grep -q 'sin ejecución automática' docs/product-phase2.md
          echo 'PASS_PRODUCT_PHASE2B_CONTRACT'

      - name: Validate browser QA contract
        shell: bash
        run: |
          grep -q "browserName: 'chromium'" playwright.config.mjs
          grep -q "browserName: 'firefox'" playwright.config.mjs
          grep -q "browserName: 'webkit'" playwright.config.mjs
          grep -q 'retries: 0' playwright.config.mjs
          grep -q 'workers: process.env.CI ? 1' playwright.config.mjs
          grep -q "command: 'node tests/serve.mjs'" playwright.config.mjs
          grep -q 'width: 320' playwright.config.mjs
          grep -q 'width: 1920' playwright.config.mjs
          grep -q 'mobile-webkit-landscape' playwright.config.mjs
          grep -q 'expectNoViewportOverflow' tests/e2e/dashboard-responsive.spec.mjs
          grep -q 'expectCanvasMatchesContainer' tests/e2e/dashboard-responsive.spec.mjs
          grep -q 'page.screenshot' tests/e2e/dashboard-responsive.spec.mjs
          echo 'PASS_BROWSER_QA_CONTRACT'

      - name: Enforce static performance budgets
        run: npm run qa:budget

      - name: Safety assertions
        shell: bash
        run: |
          grep -q 'btc-shadow-90d-20260817T173948Z' index.html
          grep -q 'SHADOW' index.html
          grep -q 'SPOT_ONLY' index.html
          grep -q 'API READ-ONLY' index.html
          grep -q 'btc-shadow-dashboard-api-o7li7xggnq-rj.a.run.app' assets/app.js

          if grep -RniE -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|"private_key"[[:space:]]*:|BINANCE_API_SECRET|EXCHANGE_API_SECRET|FIREBASE_PRIVATE_KEY|serviceAccountKey|GOCSPX-|clientSecret|signerKey|saltSeparator' . --exclude-dir=.git --exclude='validate-dashboard.yml'; then
            echo 'Material sensible detectado.'
            exit 1
          fi

          if grep -niE -- "method:[[:space:]]*['\"](POST|PUT|PATCH|DELETE)['\"]|/api/v3/order" assets/app.js assets/accessibility.js assets/responsive-bootstrap.js assets/product.js; then
            echo 'Se detectó una ruta o método de escritura prohibido en la capa Quant del frontend.'
            exit 1
          fi

          if grep -niE -- 'localStorage\.(setItem|getItem).*password|localStorage\.(setItem|getItem).*token|sessionStorage\.(setItem|getItem).*password|sessionStorage\.(setItem|getItem).*token' assets/product.js assets/firebase-auth.js; then
            echo 'Persistencia manual prohibida de password/token detectada.'
            exit 1
          fi

      - name: Guardrail assertions
        shell: bash
        run: |
          grep -q 'sin órdenes reales' index.html
          grep -q 'no SELL' index.html
          grep -q 'no shorts' index.html
          grep -q 'API pública sólo lectura' docs/optimization-log.md
          grep -q 'ningún dato de usuario modifica V5.9.0' docs/product-phase2.md

  browser-qa:
    name: Browser QA · Responsive + Accessibility
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 14
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned QA dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify preinstalled browser engines
        run: npx playwright --version

      - name: List QA matrix
        run: npm run qa:list

      - name: Run deterministic responsive accessibility navigation and product QA
        run: npm run qa:e2e

      - name: Upload QA screenshots traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-a11y-qa-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  lighthouse:
    name: Lighthouse · Performance Accessibility Best Practices SEO
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Chrome runtime
        shell: bash
        run: |
          google-chrome --version || google-chrome-stable --version

      - name: Run deterministic mobile Lighthouse gate
        shell: bash
        run: |
          node tests/serve.mjs > /tmp/btc-dashboard-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          npm run qa:lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-lighthouse-${{ github.run_id }}
          path: artifacts/lighthouse/
          if-no-files-found: warn
          retention-days: 14